services:
  # Redis for BullMQ, with append-only persistence so queued jobs survive restarts
  redis:
    image: redis:7-alpine
    container_name: email-scheduler-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - email-scheduler-network

  # Email Scheduler API (the worker runs in its own container below)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-scheduler-api
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - RUN_WORKER=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - email-scheduler-network
    restart: unless-stopped

  # Email worker (sends the queued emails)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-scheduler-worker
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - email-scheduler-network
    restart: unless-stopped

networks:
  email-scheduler-network:
    driver: bridge

volumes:
  redis-data:
